# Default values for terminal controller helm chart.

replicaCount: 1

image: ghcr.io/sealos-apps/terminal/runtime/controller:latest
imagePullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "terminal"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "terminal-controller-manager"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

service:
  metrics:
    port: 8443

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

config:
  cloudDomain: "cloud.sealos.io"
  cloudPort: ""
  httpPort: ""
  disableHttps: false
  certSecretName: ""
  ingressTLSSecretName: "wildcard-cert-sealos"

platform:
  tlsRejectUnauthorized: "1"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2

startupProbe:
  httpGet:
    path: /healthz
    port: 8081
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

# If no affinity is provided a default podAntiAffinity is used to spread controllers.
affinity: {}
