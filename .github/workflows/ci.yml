name: terminal-ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish runtime and cluster images
        required: true
        default: false
        type: boolean
      publish_arm64:
        description: Also publish linux/arm64 images
        required: true
        default: false
        type: boolean
      upload_oss:
        description: Upload cluster image archives to OSS
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  RUNTIME_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}/runtime
  CLUSTER_IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}/cluster
  SEALOS_VERSION: v5.1.2-rc5

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ci
      - run: pnpm test:components:ci
      - run: pnpm lint
      - run: pnpm build

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - run: go test ./...
      - run: go build ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint deploy/charts/terminal -f deploy/charts/terminal/terminal-values.yaml
      - run: |
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string frontend.terminalConfig.ttyAgentBaseUrl=https://tty-bridge.example.com
      - run: |
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string global.http.disableHttps=true \
            --set-string global.http.domain=terminal.example.com \
            --set-string global.http.httpPort=80 > /tmp/terminal-http.yaml
          if grep -E 'https://|:443|^  tls:' /tmp/terminal-http.yaml | \
            grep -Ev 'https://[^[:space:]" ]+\.svc\.cluster\.local(:[0-9]+)?/'; then
            echo 'HTTP render contains an external HTTPS URL, port 443, or Ingress TLS.' >&2
            exit 1
          fi
      - name: Verify unified runtime image values
        run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string frontend.image=ghcr.io/sealos-apps/terminal/runtime/frontend:ci-test \
            --set-string controller.image=ghcr.io/sealos-apps/terminal/runtime/controller:ci-test \
            > /tmp/terminal-runtime-images.yaml
          grep -Fq 'ghcr.io/sealos-apps/terminal/runtime/frontend:ci-test' /tmp/terminal-runtime-images.yaml
          grep -Fq 'ghcr.io/sealos-apps/terminal/runtime/controller:ci-test' /tmp/terminal-runtime-images.yaml

  sealos-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sealos app audit skill
        run: git clone --depth=1 https://github.com/sealos-apps/skills.git "${RUNNER_TEMP}/sealos-skills"
      - name: Audit repository with sealos-apps-audit
        run: |
          python3 "${RUNNER_TEMP}/sealos-skills/skills/sealos-apps-audit/scripts/audit_sealos_apps.py" \
            "${GITHUB_WORKSPACE}" \
            --deploy-dir deploy \
            --app-type app

  release-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      oss_prefix: ${{ steps.metadata.outputs.oss_prefix }}
      oss_tag: ${{ steps.metadata.outputs.oss_tag }}
    steps:
      - name: Reject publishing from non-main manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name != 'main' && (inputs.publish_images == true || inputs.upload_oss == true)
        run: |
          echo "::error::Publishing from a non-main branch is not supported; run this workflow from main or a v* tag."
          exit 1
      - name: Compute archive metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            oss_tag="${GITHUB_REF_NAME//\//-}"
            oss_prefix="release/${GITHUB_REF_NAME}"
          else
            oss_tag="main-${short_sha}"
            oss_prefix="ci/main/${short_sha}"
          fi

          echo "oss_tag=${oss_tag}" >> "${GITHUB_OUTPUT}"
          echo "oss_prefix=${oss_prefix}" >> "${GITHUB_OUTPUT}"
          echo "Archive tag: ${oss_tag}"
          echo "OSS prefix: ${oss_prefix}"

  runtime_images_amd64:
    if: github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true
    runs-on: ubuntu-24.04
    needs:
      - frontend
      - controller
      - release-metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: controller
            context: controller
            dockerfile: controller/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.component == 'controller'
        with:
          go-version: "1.24.0"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build controller binary
        if: matrix.component == 'controller'
        run: |
          make -C controller build TARGETARCH=amd64
          mv controller/bin/manager controller/bin/controller-terminal-amd64
          chmod +x controller/bin/controller-terminal-amd64
      - name: Build runtime image
        env:
          RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}-amd64
          PUSH_IMAGE: ${{ github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true }}
        run: |
          set -euo pipefail
          docker build \
            --tag "${RUNTIME_IMAGE}" \
            --file "${{ matrix.dockerfile }}" \
            --build-arg TARGETARCH=amd64 \
            "${{ matrix.context }}"
          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            docker push "${RUNTIME_IMAGE}"
          fi

  runtime_images_arm64:
    if: inputs.publish_arm64 == true && (inputs.publish_images == true || inputs.upload_oss == true)
    runs-on: ubuntu-24.04-arm
    needs:
      - frontend
      - controller
      - release-metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: controller
            context: controller
            dockerfile: controller/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.component == 'controller'
        with:
          go-version: "1.24.0"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build controller binary
        if: matrix.component == 'controller'
        run: |
          make -C controller build TARGETARCH=arm64
          mv controller/bin/manager controller/bin/controller-terminal-arm64
          chmod +x controller/bin/controller-terminal-arm64
      - name: Build and push runtime image
        env:
          RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/${{ matrix.component }}:${{ github.sha }}-arm64
        run: |
          set -euo pipefail
          docker build \
            --tag "${RUNTIME_IMAGE}" \
            --file "${{ matrix.dockerfile }}" \
            --build-arg TARGETARCH=arm64 \
            "${{ matrix.context }}"
          docker push "${RUNTIME_IMAGE}"

  runtime-release:
    runs-on: ubuntu-24.04
    needs:
      - runtime_images_amd64
      - runtime_images_arm64
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true) &&
      needs.runtime_images_amd64.result == 'success' &&
      (needs.runtime_images_arm64.result == 'success' || needs.runtime_images_arm64.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime manifests and inspect sizes
        env:
          IMAGE_NAMESPACE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}
          PUBLISH_ARM64: ${{ inputs.publish_arm64 }}
          SUPPORTED_PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          for component in frontend controller; do
            sources=("${IMAGE_NAMESPACE}/${component}:${GITHUB_SHA}-amd64")
            if [[ "${PUBLISH_ARM64}" == "true" ]]; then
              sources+=("${IMAGE_NAMESPACE}/${component}:${GITHUB_SHA}-arm64")
            fi
            for tag in "${GITHUB_SHA}" latest; do
              target="${IMAGE_NAMESPACE}/${component}:${tag}"
              docker manifest create "${target}" "${sources[@]}"
              docker manifest push "${target}"
              docker manifest inspect "${target}"
            done
          done
      - name: Runtime manifest summary
        run: echo "Runtime manifests cover ${SUPPORTED_PLATFORMS} using native amd64 and optional native arm64 builds."

  cluster_images_amd64:
    runs-on: ubuntu-24.04
    needs:
      - runtime-release
      - release-metadata
    if: github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Sealos
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          sealos_version="${SEALOS_VERSION#v}"
          curl -fsSL -o "${work_dir}/sealos.tar.gz" \
            "https://github.com/labring/sealos/releases/download/${SEALOS_VERSION}/sealos_${sealos_version}_linux_amd64.tar.gz"
          tar -xzf "${work_dir}/sealos.tar.gz" -C "${work_dir}"
          sudo install "${work_dir}/sealos" /usr/local/bin/sealos
          sealos version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Sealos to GHCR
        run: sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
      - name: Build and archive cluster image
        working-directory: deploy
        env:
          FRONTEND_RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          CONTROLLER_RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/controller:${{ github.sha }}
          CLUSTER_IMAGE: ${{ env.CLUSTER_IMAGE_NAMESPACE }}/terminal:${{ github.sha }}-amd64
          ARCH: amd64
          OSS_TAG: ${{ needs.release-metadata.outputs.oss_tag }}
        run: |
          set -euo pipefail
          tar_basename="terminal-terminal-${OSS_TAG}-${ARCH}"
          chart_values="${GITHUB_WORKSPACE}/deploy/charts/terminal/values.yaml"
          sed -i -E "s;^  image: ghcr.io/sealos-apps/terminal/runtime/frontend.*;  image: ${FRONTEND_RUNTIME_IMAGE};" "${chart_values}"
          sed -i -E "s;^  image: ghcr.io/sealos-apps/terminal/runtime/controller.*;  image: ${CONTROLLER_RUNTIME_IMAGE};" "${chart_values}"
          grep -Fqx "  image: ${FRONTEND_RUNTIME_IMAGE}" <(sed -n '/^frontend:/,/^controller:/{/^  image:/p;}' "${chart_values}")
          grep -Fqx "  image: ${CONTROLLER_RUNTIME_IMAGE}" <(sed -n '/^controller:/,/^cloudDomain:/{/^  image:/p;}' "${chart_values}")
          rm -rf registry
          sudo sealos registry save --registry-dir registry --arch "${ARCH}" .
          sudo sealos build -t "${CLUSTER_IMAGE}" --platform "linux/${ARCH}" -f Kubefile .
          sudo sealos push "${CLUSTER_IMAGE}"
          sudo sealos save -o "${RUNNER_TEMP}/${tar_basename}.tar" "${CLUSTER_IMAGE}"
          gzip -f "${RUNNER_TEMP}/${tar_basename}.tar"
          md5sum "${RUNNER_TEMP}/${tar_basename}.tar.gz" > "${RUNNER_TEMP}/${tar_basename}.tar.gz.md5"
          ls -lh "${RUNNER_TEMP}/${tar_basename}.tar.gz" "${RUNNER_TEMP}/${tar_basename}.tar.gz.md5"
          du -h "${RUNNER_TEMP}/${tar_basename}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-bundle-terminal-amd64
          path: |
            ${{ runner.temp }}/terminal-terminal-${{ needs.release-metadata.outputs.oss_tag }}-amd64.tar.gz
            ${{ runner.temp }}/terminal-terminal-${{ needs.release-metadata.outputs.oss_tag }}-amd64.tar.gz.md5
          if-no-files-found: error
          retention-days: 7

  cluster_images_arm64:
    if: inputs.publish_arm64 == true && (inputs.publish_images == true || inputs.upload_oss == true)
    runs-on: ubuntu-24.04-arm
    needs:
      - runtime-release
      - release-metadata
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Sealos
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          sealos_version="${SEALOS_VERSION#v}"
          curl -fsSL -o "${work_dir}/sealos.tar.gz" \
            "https://github.com/labring/sealos/releases/download/${SEALOS_VERSION}/sealos_${sealos_version}_linux_arm64.tar.gz"
          tar -xzf "${work_dir}/sealos.tar.gz" -C "${work_dir}"
          sudo install "${work_dir}/sealos" /usr/local/bin/sealos
          sealos version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Sealos to GHCR
        run: sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
      - name: Build and archive cluster image
        working-directory: deploy
        env:
          FRONTEND_RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          CONTROLLER_RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAMESPACE }}/controller:${{ github.sha }}
          CLUSTER_IMAGE: ${{ env.CLUSTER_IMAGE_NAMESPACE }}/terminal:${{ github.sha }}-arm64
          ARCH: arm64
          OSS_TAG: ${{ needs.release-metadata.outputs.oss_tag }}
        run: |
          set -euo pipefail
          tar_basename="terminal-terminal-${OSS_TAG}-${ARCH}"
          chart_values="${GITHUB_WORKSPACE}/deploy/charts/terminal/values.yaml"
          sed -i -E "s;^  image: ghcr.io/sealos-apps/terminal/runtime/frontend.*;  image: ${FRONTEND_RUNTIME_IMAGE};" "${chart_values}"
          sed -i -E "s;^  image: ghcr.io/sealos-apps/terminal/runtime/controller.*;  image: ${CONTROLLER_RUNTIME_IMAGE};" "${chart_values}"
          grep -Fqx "  image: ${FRONTEND_RUNTIME_IMAGE}" <(sed -n '/^frontend:/,/^controller:/{/^  image:/p;}' "${chart_values}")
          grep -Fqx "  image: ${CONTROLLER_RUNTIME_IMAGE}" <(sed -n '/^controller:/,/^cloudDomain:/{/^  image:/p;}' "${chart_values}")
          rm -rf registry
          sudo sealos registry save --registry-dir registry --arch "${ARCH}" .
          sudo sealos build -t "${CLUSTER_IMAGE}" --platform "linux/${ARCH}" -f Kubefile .
          sudo sealos push "${CLUSTER_IMAGE}"
          sudo sealos save -o "${RUNNER_TEMP}/${tar_basename}.tar" "${CLUSTER_IMAGE}"
          gzip -f "${RUNNER_TEMP}/${tar_basename}.tar"
          md5sum "${RUNNER_TEMP}/${tar_basename}.tar.gz" > "${RUNNER_TEMP}/${tar_basename}.tar.gz.md5"
          ls -lh "${RUNNER_TEMP}/${tar_basename}.tar.gz" "${RUNNER_TEMP}/${tar_basename}.tar.gz.md5"
          du -h "${RUNNER_TEMP}/${tar_basename}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-bundle-terminal-arm64
          path: |
            ${{ runner.temp }}/terminal-terminal-${{ needs.release-metadata.outputs.oss_tag }}-arm64.tar.gz
            ${{ runner.temp }}/terminal-terminal-${{ needs.release-metadata.outputs.oss_tag }}-arm64.tar.gz.md5
          if-no-files-found: error
          retention-days: 7

  cluster-release:
    runs-on: ubuntu-24.04
    needs:
      - cluster_images_amd64
      - cluster_images_arm64
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.publish_images == true || inputs.upload_oss == true) &&
      needs.cluster_images_amd64.result == 'success' &&
      (needs.cluster_images_arm64.result == 'success' || needs.cluster_images_arm64.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cluster manifests and inspect sizes
        env:
          IMAGE_NAMESPACE: ${{ env.CLUSTER_IMAGE_NAMESPACE }}
          PUBLISH_ARM64: ${{ inputs.publish_arm64 }}
          SUPPORTED_PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          component=terminal
          sources=("${IMAGE_NAMESPACE}/${component}:${GITHUB_SHA}-amd64")
          if [[ "${PUBLISH_ARM64}" == "true" ]]; then
            sources+=("${IMAGE_NAMESPACE}/${component}:${GITHUB_SHA}-arm64")
          fi
          for tag in "${GITHUB_SHA}" latest; do
            target="${IMAGE_NAMESPACE}/${component}:${tag}"
            docker manifest create "${target}" "${sources[@]}"
            docker manifest push "${target}"
            docker manifest inspect "${target}"
          done
          echo "Cluster manifests cover ${SUPPORTED_PLATFORMS} using native amd64 and optional native arm64 builds."

  oss-upload:
    runs-on: ubuntu-latest
    needs:
      - cluster_images_amd64
      - cluster_images_arm64
      - release-metadata
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.upload_oss == true) &&
      needs.cluster_images_amd64.result == 'success' &&
      (needs.cluster_images_arm64.result == 'success' || needs.cluster_images_arm64.result == 'skipped')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cluster-bundle-*
          path: cluster-bundles
          merge-multiple: true
      - name: Upload cluster archives to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_PREFIX: ${{ needs.release-metadata.outputs.oss_prefix }}
          PUBLISH_ARM64: ${{ inputs.publish_arm64 }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          : "${OSS_PREFIX:?OSS_PREFIX is required}"

          shopt -s nullglob
          archives=(cluster-bundles/*.tar.gz)
          checksums=(cluster-bundles/*.md5)
          expected_archives=1
          if [[ "${PUBLISH_ARM64}" == "true" ]]; then
            expected_archives=2
          fi
          [[ "${#archives[@]}" -eq "${expected_archives}" ]] || { echo "Expected ${expected_archives} cluster archives, found ${#archives[@]}" >&2; exit 1; }
          [[ "${#checksums[@]}" -eq "${expected_archives}" ]] || { echo "Expected ${expected_archives} cluster checksums, found ${#checksums[@]}" >&2; exit 1; }
          ls -lh "${archives[@]}" "${checksums[@]}"

          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          command -v ossutil64

          for archive in "${archives[@]}"; do
            ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" "${archive%.tar.gz}.tar.gz" "oss://${OSS_BUCKET}/${OSS_PREFIX}/$(basename "${archive}")" # tar.gz upload
          done
          for checksum in "${checksums[@]}"; do
            ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" "${checksum%.md5}.md5" "oss://${OSS_BUCKET}/${OSS_PREFIX}/$(basename "${checksum}")" # md5 upload
          done
