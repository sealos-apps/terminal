name: terminal-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ci
      - run: pnpm test:components:ci
      - run: pnpm lint
      - run: pnpm build

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - run: go test ./...
      - run: go build ./...

  tty-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tty-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable bridge toolchain
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint deploy/charts/terminal -f deploy/charts/terminal/terminal-values.yaml
      - run: |
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string frontend.terminalConfig.ttyAgentBaseUrl=https://tty-bridge.example.com
      - run: |
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string disableHttps=true \
            --set-string cloudDomain=terminal.example.com \
            --set-string httpPort=80 > /tmp/terminal-http.yaml
          if grep -E 'https://|:443|^  tls:' /tmp/terminal-http.yaml | \
            grep -Ev 'https://[^[:space:]" ]+\.svc\.cluster\.local(:[0-9]+)?/'; then
            echo 'HTTP render contains an external HTTPS URL, port 443, or Ingress TLS.' >&2
            exit 1
          fi
      - run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string cloudDomain=example.com \
            --show-only templates/frontend-deployment.yaml > /tmp/terminal-frontend-auto.yaml
          grep -Fq 'value: "https://tty-bridge.example.com"' /tmp/terminal-frontend-auto.yaml
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string cloudDomain=example.com \
            --show-only templates/tty-bridge-configmap.yaml > /tmp/terminal-bridge-config.yaml
          grep -Fq 'https://terminal.example.com' /tmp/terminal-bridge-config.yaml
          ! grep -Fq 'WS_ALLOWED_ORIGINS": []' /tmp/terminal-bridge-config.yaml
          ! grep -Fq 'WS_ALLOWED_ORIGINS": ["*"]' /tmp/terminal-bridge-config.yaml
      - name: Verify configurable bridge probe port
        run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string ttyBridge.config.port=8080 \
            --show-only templates/tty-bridge-deployment.yaml > /tmp/terminal-bridge-custom-port.yaml
          grep -Fq 'containerPort: 8080' /tmp/terminal-bridge-custom-port.yaml
          [[ "$(grep -Fc 'port: http' /tmp/terminal-bridge-custom-port.yaml)" -eq 3 ]]
      - name: Verify controller Helm health test
        run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --show-only templates/controller-service.yaml \
            --show-only templates/controller-test-health.yaml > /tmp/terminal-controller-health.yaml
          grep -Fq 'name: terminal-controller-manager-health-service' /tmp/terminal-controller-health.yaml
          grep -Fq 'targetPort: health' /tmp/terminal-controller-health.yaml
          grep -Fq 'http://terminal-controller-manager-health-service.terminal-system.svc.cluster.local:8081/readyz' /tmp/terminal-controller-health.yaml
          ! grep -Fq '/metrics' /tmp/terminal-controller-health.yaml
      - name: Verify configurable controller health port
        run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string controller.service.health.port=18081 \
            --show-only templates/controller-deployment.yaml \
            --show-only templates/controller-service.yaml \
            --show-only templates/controller-test-health.yaml > /tmp/terminal-controller-custom-health-port.yaml
          grep -Fq -- '--health-probe-bind-address=:18081' /tmp/terminal-controller-custom-health-port.yaml
          grep -Fq 'containerPort: 18081' /tmp/terminal-controller-custom-health-port.yaml
          grep -Fq 'targetPort: health' /tmp/terminal-controller-custom-health-port.yaml
          [[ "$(grep -Fc 'port: health' /tmp/terminal-controller-custom-health-port.yaml)" -eq 3 ]]
          grep -Fq 'http://terminal-controller-manager-health-service.terminal-system.svc.cluster.local:18081/readyz' /tmp/terminal-controller-custom-health-port.yaml
      - name: Verify unified runtime image values
        run: |
          set -euo pipefail
          helm template terminal deploy/charts/terminal \
            --namespace terminal-system \
            --values deploy/charts/terminal/terminal-values.yaml \
            --set-string frontend.image=ghcr.io/sealos-apps/terminal/terminal-frontend:ci-test \
            --set-string controller.image=ghcr.io/sealos-apps/terminal/terminal-controller:ci-test \
            > /tmp/terminal-runtime-images.yaml
          grep -Fq 'ghcr.io/sealos-apps/terminal/terminal-frontend:ci-test' /tmp/terminal-runtime-images.yaml
          grep -Fq 'ghcr.io/sealos-apps/terminal/terminal-controller:ci-test' /tmp/terminal-runtime-images.yaml

  sealos-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sealos app audit skill
        run: git clone --depth=1 https://github.com/sealos-apps/skills.git "${RUNNER_TEMP}/sealos-skills"
      - name: Audit repository with sealos-apps-audit
        run: |
          python3 "${RUNNER_TEMP}/sealos-skills/skills/sealos-apps-audit/scripts/audit_sealos_apps.py" \
            "${GITHUB_WORKSPACE}" \
            --deploy-dir deploy \
            --app-type app
