# User-customizable values for the unified Terminal deployment.

frontend:
  replicaCount: 1
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 10m
      memory: 128Mi
  terminalConfig:
    ttydImage: "docker.io/labring4docker/terminal:1.25.1-5"
    keepalived: "30m"
    ttyAgentBaseUrl: ""

controller:
  replicaCount: 1
  config:
    ingressTLSSecretName: "wildcard-cert-sealos"

platform:
  tlsRejectUnauthorized: "1"
