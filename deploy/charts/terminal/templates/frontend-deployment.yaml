apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terminal-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "terminal-frontend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "terminal-frontend.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
      {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          env:
            - name: TTYD_IMAGE
              value: {{ .Values.frontend.terminalConfig.ttydImage | quote }}
            - name: SITE
              value: {{ include "terminal-frontend.cloudOrigin" . | quote }}
            - name: KEEPALIVED
              value: {{ .Values.frontend.terminalConfig.keepalived | quote }}
            - name: TTY_AGENT_BASE_URL
              value: {{ include "terminal-tty-bridge.agentBaseUrl" . | quote }}
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.platform.tlsRejectUnauthorized | quote }}
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: terminal-frontend-volume
              mountPath: /config.yaml
              subPath: config.yaml
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: terminal-frontend-volume
          configMap:
            name: {{ include "terminal-frontend.fullname" . }}-config
