apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "terminal.fullname" . }}-test-health"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terminal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - "http://{{ include "terminal.fullname" . }}-controller-manager-health-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.service.health.port }}/readyz"
